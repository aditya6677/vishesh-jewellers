name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches app version
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag must match package version');"
      - run: npm ci
      - run: npm test
      - name: Test legacy backend
        run: npm test
        env:
          BACKEND_MODE: legacy
      - name: Verify native OS-protected database keys
        run: npm run check:database-key
      - name: Verify native setup and recovery
        run: npm run check:setup-recovery
      - name: Build unsigned Windows x64 installer
        if: runner.os == 'Windows'
        shell: bash
        run: npm run package:windows -- --x64 --publish never -c.win.signExecutable=false
      - name: Build unsigned universal macOS DMG
        if: runner.os == 'macOS'
        run: npm run package:mac:universal -- --publish never -c.mac.identity=null
      - name: Verify packaged Windows backend
        if: runner.os == 'Windows'
        run: npm run check:packaged -- "${{ github.workspace }}/dist/win-unpacked/resources/app.asar.unpacked"
      - name: Verify packaged macOS backend
        if: runner.os == 'macOS'
        run: npm run check:packaged -- "${{ github.workspace }}/dist/mac-universal/Vishesh Jewellers.app/Contents/Resources/app.asar.unpacked"
      - name: Verify packaged Windows database, accounts and recovery
        if: runner.os == 'Windows'
        run: npm run check:packaged:database -- "${{ github.workspace }}/dist/win-unpacked/resources/app.asar.unpacked"
      - name: Verify packaged macOS database, accounts and recovery
        if: runner.os == 'macOS'
        run: npm run check:packaged:database -- "${{ github.workspace }}/dist/mac-universal/Vishesh Jewellers.app/Contents/Resources/app.asar.unpacked"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Generate installer checksums
        working-directory: release-assets
        run: sha256sum -- *.exe *.dmg > SHA256SUMS.txt
      - name: Publish verified unsigned installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Vishesh Jewellers $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
